services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flood
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flood"]
      interval: 5s
      retries: 20
  migrate:
    image: postgis/postgis:16-3.4
    environment:
      PGHOST: db
      PGUSER: flood
      PGDATABASE: flood
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/002_provenance.sql"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://flood:${POSTGRES_PASSWORD}@db:5432/flood
      PROVIDER_CACHE_PATH: /app/cache/providers.sqlite
      PUBLIC_DATA_ENABLED: ${PUBLIC_DATA_ENABLED:-true}
      MODEL_DIRECTORY: /app/models
    volumes:
      - providercache:/app/cache
      - ./data/models:/app/models:ro
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  hii-import:
    profiles: ["hii-import"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql://flood:${POSTGRES_PASSWORD}@db:5432/flood
    volumes:
      - hiiarchive:/app/archive
    command: ["python", "-m", "app.hii_archive", "--station", "${HII_STATION:-CPY001}", "--month", "${HII_MONTH:-202609}", "--destination", "/app/archive", "--source-timezone", "Asia/Bangkok", "--accept-non-commercial", "--import-db"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  airflow:
    build:
      context: .
      dockerfile: pipelines/Dockerfile
    profiles: ["pipeline"]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://flood:${POSTGRES_PASSWORD}@db:5432/flood
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./pipelines/dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data:ro
      - airflowdata:/opt/airflow
volumes:
  pgdata:
  airflowdata:
  providercache:
  hiiarchive:
