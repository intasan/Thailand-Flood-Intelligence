name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: flood_test
          POSTGRES_USER: flood
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flood -d flood_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://flood:test_only_password@localhost:5432/flood_test
          PUBLIC_DATA_ENABLED: 'false'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm test && npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local test stack
        run: docker compose up --build --wait --wait-timeout 180 db api web
        env:
          POSTGRES_PASSWORD: test_only_password
          PUBLIC_DATA_ENABLED: 'false'
      - name: Verify real API, database and Next proxy
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health/ready
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/api/v1/status
          curl --fail http://localhost:3000/api/openapi.json
          curl --fail http://localhost:3000/api/v1/readiness
          curl --fail http://localhost:3000/readiness
          curl --fail -X POST -H "Content-Type: application/json" -d '{"lat":13.75,"lon":100.5}' http://localhost:3000/api/v1/assess | python -c "import json,sys; d=json.load(sys.stdin); assert d['risk']=='unknown'; assert d['flood_depth_m'] is None"
      - name: Import and query one real HII historical station-month
        run: |
          docker compose --profile hii-import run --rm hii-import
          curl --fail "http://localhost:3000/api/v1/observations?station_id=HII%3ACPY001" | python -c "import json,sys; d=json.load(sys.stdin); assert d['count']>0; assert d['station']['id']=='HII:CPY001'; assert d['results'][0]['metadata']['data_type']=='historical_station_observation'; print('Real HII archive read successfully; observations:',d['count'])"
        env:
          POSTGRES_PASSWORD: test_only_password
          PUBLIC_DATA_ENABLED: 'false'
      - name: Export real HII observations with original provenance
        run: |
          docker compose exec -T api python -m app.observation_export --station HII:CPY001 --start 2026-09-29T17:00:00Z --end 2026-09-30T17:00:00Z --interval-seconds 600 --accepted-flag N --destination /tmp/hii-validation-observations
          docker compose exec -T api python -c "import json,pathlib,hashlib; from app.level_validation import load_series; from app.rainfall_input import timestamp; p=pathlib.Path('/tmp/hii-validation-observations'); raw=(p/'observations.csv').read_bytes(); d=json.loads((p/'observations-descriptor.json').read_text()); v=json.loads((p/'provenance.json').read_text()); assert hashlib.sha256(raw).hexdigest()==d['raw_sha256']; assert v['exported_rows']>0 and v['expected_intervals']==144; assert all(r['timestamp_status'].startswith('assumed') and r['source_timezone']=='Asia/Bangkok' for r in v['records']); assert 'Non-Commercial' in d['license_evidence']; rows=load_series(raw,d,{'HII:CPY001'},timestamp(v['window_start']),timestamp(v['window_end']),600); assert len(rows)==v['exported_rows']; print('Real HII observation export verified:',len(rows),'rows; original timezone assumptions retained; no simulation generated')"
        env:
          POSTGRES_PASSWORD: test_only_password
          PUBLIC_DATA_ENABLED: 'false'
      - name: Execute manual Airflow export DAG against actual HII data
        run: |
          docker compose --profile pipeline build airflow
          docker compose --profile pipeline run --rm --no-deps airflow airflow db migrate
          docker compose --profile pipeline run --rm --no-deps airflow airflow dags test hii_observation_export 2026-10-01T00:00:00+00:00 --conf '{"station":"CPY001","request_id":"ci-hii-export","start":"2026-09-29T17:00:00Z","end":"2026-09-30T17:00:00Z","interval_seconds":600,"accept_non_commercial":true}'
          docker compose --profile pipeline run --rm --no-deps airflow python -c "import pathlib,json,hashlib; from airflow.models import DagRun; from airflow.settings import Session; p=pathlib.Path('/opt/airflow/research_exports/ci-hii-export'); raw=(p/'observations.csv').read_bytes(); d=json.loads((p/'observations-descriptor.json').read_text()); v=json.loads((p/'provenance.json').read_text()); assert hashlib.sha256(raw).hexdigest()==d['raw_sha256']; assert v['exported_rows']==144 and all(r['source_timezone']=='Asia/Bangkok' for r in v['records']); s=Session(); run=s.query(DagRun).filter(DagRun.dag_id=='hii_observation_export').first(); assert run is not None and run.state=='success'; s.close(); print('Real Airflow DAG HII export verified:',v['exported_rows'],'rows; no simulation generated')"
        env:
          POSTGRES_PASSWORD: test_only_password
          PUBLIC_DATA_ENABLED: 'false'
      - name: Show logs
        if: failure()
        run: docker compose logs --tail=100
        env:
          POSTGRES_PASSWORD: test_only_password
      - name: Stop local test stack
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: test_only_password
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f pipelines/Dockerfile -t flood-airflow-test .
      - name: Validate DAG imports
        run: |
          docker run --rm -v "$PWD/pipelines/dags:/opt/airflow/dags:ro" --entrypoint python flood-airflow-test -c "from airflow.models import DagBag; b=DagBag('/opt/airflow/dags',include_examples=False); assert not b.import_errors, b.import_errors; assert 'approved_observations' in b.dags; assert 'hii_historical' in b.dags; assert 'hii_observation_export' in b.dags; d=b.dags['hii_observation_export']; assert d.schedule_interval is None and d.max_active_runs==1; assert d.get_task('export_snapshot').retries==0; assert d.params['accept_non_commercial'] is False"
